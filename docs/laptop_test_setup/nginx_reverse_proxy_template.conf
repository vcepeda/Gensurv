# Template based on the real production nginx config (/etc/nginx/sites-available/
# reverse-proxy.conf). Adapted for local testing: no SSL/certbot (not needed for
# a laptop that isn't exposed to the internet), server_name is localhost, and
# every path is a placeholder - replace <PATH-TO-GENSURV> with wherever you
# cloned the repo (e.g. /home/you/Gensurv).
#
# Only needed if you specifically want to test nginx/gunicorn behavior itself
# (e.g. large-upload timeout/buffering settings) - see TUTORIAL.md for the
# simpler runserver + npm-dev setup that's enough for testing the app itself.

server {
    listen 8080;
    server_name localhost;

    # Same large-upload settings as production - see the ops README for why
    # these specific values were chosen (gunicorn sync workers don't
    # heartbeat during a single long request, so both nginx and gunicorn
    # need a timeout long enough to cover a full large-file upload).
    client_max_body_size 100G;
    client_body_timeout 28800s;
    proxy_read_timeout  28800s;
    proxy_send_timeout  28800s;

    location /static/ {
        alias <PATH-TO-GENSURV>/backend/staticfiles/;
    }

    location /media/ {
        alias <PATH-TO-GENSURV>/backend/media/;
    }

    error_log /tmp/gensurv_nginx_error.log;
    access_log /tmp/gensurv_nginx_access.log;

    location /api/ {
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx streams the upload straight to gunicorn instead of buffering
        # the whole file to disk first.
        proxy_request_buffering off;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /password_reset/ {
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /reset/ {
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hijack/ {
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        root <PATH-TO-GENSURV>/frontend/dist;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root <PATH-TO-GENSURV>/frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
